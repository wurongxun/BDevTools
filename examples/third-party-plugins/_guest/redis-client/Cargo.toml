[package]
name = "redis-client-guest"
version = "0.4.0"
edition = "2021"
description = "redis-client 第三方插件的 WASM 后端（Extism guest）：自实现 RESP 客户端 + P2 运维分析，字节收发走宿主 net:tcp 能力"
publish = false

# 独立包：不要被上层任何 workspace 吸进去
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism 的 guest 侧 PDK：负责「字符串 ↔ WASM 内存」的 ABI，别手写裸指针
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
