[package]
name = "text-toolkit-guest"
version = "1.0.0"
edition = "2021"
description = "示例第三方插件的 WASM 后端（Extism PDK）"
publish = false

# 独立包：不要被上层任何 workspace 吸进去
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Extism 的 guest 侧 PDK：负责「字符串 ↔ WASM 内存」的 ABI，别手写裸指针
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
