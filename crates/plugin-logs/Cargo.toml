[package]
name = "bdevtools-plugin-logs"
version = "0.1.0"
edition = "2021"
publish = false
description = "BDevTools built-in logs plugin (pure Rust business layer)"

[lib]
name = "bdevtools_plugin_logs"
path = "src/lib.rs"

[dependencies]
bdevtools-core = { path = "../bdevtools-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
anyhow = "1.0.104"
log = "0.4.34"
lazy_static = "1.5.1"
parking_lot = "0.12.5"
encoding_rs = "0.8"
regex = "1.13.1"
fancy-regex = "0.13"
rayon = "1"
memchr = "2"
