[package]
name = "backend_dev_tools"
version = "1.4.0"
description = "A backend development tools"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "backend_dev_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1.0.44"
log = "0.4.0"
md5 = "0.8"
hex = "0.4"
tauri-plugin-fs = "2"
lazy_static = "1.5.0"
parking_lot = "0.12.3"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
# 文件编码处理
encoding_rs = "0.8"
chardetng = "1.0.0"
# SSH/SFTP 远程连接
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
# UUID 生成
uuid = { version = "1", features = ["v4"] }
# SQLite 数据库
rusqlite = { version = "0.31", features = ["bundled"] }
# 系统通知
tauri-plugin-notification = "2"
# 数据库驱动（MySQL + PostgreSQL）
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "postgres"] }
# SQL Server 驱动：纯 Rust TDS 协议实现，无原生依赖（sqlx 自 0.7 起移除 mssql，故单独引入）
tiberius = { version = "0.12", default-features = false, features = ["tds73", "native-tls", "chrono"] }
# tiberius 需要把 tokio 的 TcpStream 适配成 futures 的 AsyncRead/AsyncWrite
tokio-util = { version = "0.7", features = ["compat"] }
# Oracle 驱动：走系统 ODBC（需用户机已安装 Oracle ODBC 驱动，避免引入 OCI 原生依赖）
odbc-api = "29"
# 流式读取查询结果（sqlx 已依赖，无额外编译成本）
futures-util = "0.3"
# CSV 文件读写
csv = "1.3"
# Excel 文件读取
calamine = "0.26"
# Excel 文件写入
rust_xlsxwriter = "0.80"
# 正则表达式（跨平台）
regex = "1.9.3"
# Java 堆转储（HPROF）解析：零拷贝 mmap 解析（MAT 插件）
jvm-hprof = "0.1"
memmap2 = "0.9"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.44.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
    'Win32_Globalization'
] }
winreg = "0.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 物理内存探测（sysctlbyname hw.memsize）；仅 macOS 编译时引入
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
